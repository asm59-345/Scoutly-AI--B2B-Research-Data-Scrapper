version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scoutly-backend
    ports:
      - "8000:8000"
    environment:
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173
      - DATABASE_URL=sqlite:///scoutly.db
      - SCRAPER_HEADLESS=true
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scoutly-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

